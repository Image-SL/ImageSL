<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImageSL</title>
<link rel="stylesheet" href="/styles.css?v=3">
</head>
<body>
<main>
  <h1>ImageSL</h1>
  <p class="sub">IHC stain quantification. Upload a slide to analyze it, then fine-tune with the controls.</p>

  <section class="box">
    <div id="dropzone" class="dropzone">
      <div class="dropzone-text">
        <span style="font-size: 20px; font-weight: bold; display: block; margin-bottom: 8px;">Drag & Drop Images Here</span>
        <span>or click to choose from your library</span>
      </div>
      <input type="file" id="file" multiple accept=".tif,.tiff,.png,.jpg,.jpeg" style="display:none;">
    </div>
    <div class="row" style="margin-top: 12px;">
      <span id="status" class="status"></span>
    </div>
    <div class="row">
      <label class="inline">Access key (optional):
        <input type="text" id="key" placeholder="X-ImageSL-Key" size="18">
      </label>
    </div>
  </section>

  <div id="resultsContainer"></div>

  <template id="resultTemplate">
    <section class="box result-card" style="margin-bottom: 30px;">
      <h2 class="filename-header" style="border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 16px; font-size: 18px; color: #333;"></h2>
      
      <div class="images">
        <figure><figcaption>Original</figcaption><img class="imgOriginal" alt=""></figure>
        <figure><figcaption>Stain A (Isolated)</figcaption><img class="imgStainA" alt=""></figure>
        <figure><figcaption>Stain B (Isolated)</figcaption><img class="imgStainB" alt=""></figure>
        <figure><figcaption>Detection Overlay</figcaption><img class="imgOverlay" alt=""></figure>
      </div>

      <div class="metrics">
        <div><b class="mPercent">&ndash;</b><span>positive area</span></div>
        <div><b class="mPositive">&ndash;</b><span>positive px</span></div>
        <div><b class="mTissue">&ndash;</b><span>tissue px</span></div>
        <div><b class="mThreshold">&ndash;</b><span>threshold</span></div>
        <div><b class="mMethod">&ndash;</b><span>stain method</span></div>
      </div>
      <div class="controls">
        <label>Background threshold <input type="range" class="cBg" min="0.05" max="0.5" step="0.01"><span class="vBg"></span></label>
        <label>Sensitivity (strict &rarr; loose) <input type="range" class="cScale" min="0.5" max="1.8" step="0.05"><span class="vScale"></span></label>
        <label>Target stain
          <select class="cTarget">
            <option value="1">Chromogen (e.g. brown)</option>
            <option value="0">Counterstain (nuclei)</option>
          </select>
        </label>
        <label>Target gain <input type="range" class="cGain" min="0.1" max="3.0" step="0.1"><span class="vGain"></span></label>
        <label>Bg recolor <input type="color" class="cColor" value="#ffffff"><a href="#" class="clearColor" style="font-size:12px; margin-left:4px;">(clear)</a></label>
      </div>

      <div class="downloads-toolbar" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; display: flex; flex-wrap: wrap; gap: 8px;">
        <button class="dl-btn dl-original">⬇ Original (.tif)</button>
        <button class="dl-btn dl-stainA">⬇ Stain A (.tif)</button>
        <button class="dl-btn dl-stainB">⬇ Stain B (.tif)</button>
        <button class="dl-btn dl-overlay">⬇ Overlay (.tif)</button>
        <button class="dl-btn dl-comparison" style="background-color: #2c3e50; color: white;">⬇ Comparison (.tif)</button>
      </div>

    </section>
  </template>
</main>
<div id="lightbox" class="lightbox hidden">
  <img id="lightboxImg" src="" alt="Expanded Image">
</div>
<script src="/app.js?v=7"></script>
</body>
</html>
