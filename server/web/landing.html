<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImageSL — staining quantification</title>
<meta name="description" content="ImageSL is a tool for staining quantification. Free desktop app for Windows and macOS; runs offline.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/logo-192.png">
<style>
  :root{
    --ink:#0d0f12;
    --ink-2:#5d636d;
    --ink-3:#9aa0aa;
    --line:#e6e8ec;
    --line-2:#d3d7dd;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:var(--font);
    font-weight:300;
    color:var(--ink);
    background:#fff;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    display:flex;
    flex-direction:column;
    min-height:100%;
  }
  a{color:inherit}

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:72px 24px 48px;
  }

  .mark{
    display:flex;align-items:center;gap:9px;
    margin-bottom:44px;
  }
  .mark img{width:22px;height:22px;border-radius:5px;display:block}
  .mark span{font-size:14px;font-weight:400;letter-spacing:.14em;color:var(--ink-2)}

  h1{
    margin:0;
    font-size:clamp(28px,4.6vw,44px);
    font-weight:200;
    letter-spacing:-.02em;
    line-height:1.18;
    max-width:14ch;
  }

  .note{
    margin:20px 0 0;
    font-size:14.5px;
    font-weight:300;
    color:var(--ink-2);
    letter-spacing:.005em;
  }

  .dl{
    display:flex;
    gap:12px;
    margin-top:40px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .btn{
    display:inline-flex;align-items:center;gap:9px;
    font-family:inherit;
    font-size:14.5px;
    font-weight:400;
    letter-spacing:.01em;
    text-decoration:none;
    padding:12px 22px;
    border-radius:3px;
    border:1px solid var(--line-2);
    background:#fff;
    color:var(--ink);
    transition:border-color .15s ease,background .15s ease,color .15s ease;
    white-space:nowrap;
  }
  .btn svg{width:15px;height:15px;flex:none;opacity:.75}
  .btn:hover{border-color:var(--ink);}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.primary svg{opacity:.9}
  .btn.primary:hover{background:#000;border-color:#000}

  .meta{
    margin-top:22px;
    font-size:12.5px;
    font-weight:300;
    color:var(--ink-3);
    letter-spacing:.02em;
  }
  .meta a{color:var(--ink-3);text-decoration:none;border-bottom:1px solid var(--line)}
  .meta a:hover{color:var(--ink-2);border-bottom-color:var(--line-2)}

  footer{
    border-top:1px solid var(--line);
    padding:20px 24px;
    display:flex;
    justify-content:center;
    gap:8px 20px;
    flex-wrap:wrap;
    font-size:12.5px;
    font-weight:300;
    color:var(--ink-3);
    letter-spacing:.01em;
  }
  footer a{text-decoration:none;color:var(--ink-3)}
  footer a:hover{color:var(--ink-2)}
  footer .sep{color:var(--line-2)}
  @media(max-width:520px){
    footer .sep{display:none}
    main{padding-top:56px}
  }
</style>
</head>
<body>

<main>
  <div class="mark">
    <img src="/assets/logo.png" alt="">
    <span>ImageSL</span>
  </div>

  <h1>A tool for staining quantification</h1>

  <p class="note">Runs on your computer. Offline.</p>

  <div class="dl">
    <a class="btn primary" id="dl-primary" href="#" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5.5 10.2 4.5v6.9H3V5.5Zm0 13 7.2 1v-6.8H3v5.8Zm8.3 1.1L21 21v-9.6h-9.7v8.2Zm0-15.2v8.1H21V3l-9.7 1.4Z"/></svg>
      <span id="dl-primary-label">Download for Windows</span>
    </a>
    <a class="btn" id="dl-secondary" href="#" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.9-3-.8c-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .7 1.1 1.6 2.3 2.8 2.2 1.1 0 1.5-.7 2.9-.7s1.7.7 2.9.7 2-1.1 2.7-2.1c.8-1.2 1.2-2.4 1.2-2.5-.1 0-2.3-.9-2.3-3.4ZM14.2 5.8c.6-.8 1-1.9.9-3-.9 0-2 .6-2.6 1.4-.6.7-1.1 1.8-.9 2.9 1 0 2-.5 2.6-1.3Z"/></svg>
      <span id="dl-secondary-label">Download for macOS</span>
    </a>
  </div>

  <p class="meta">Version <span id="ver">—</span> · <a href="/app">Open in browser</a></p>
</main>

<footer>
  <span>Research use — not for clinical diagnosis.</span>
  <span class="sep">·</span>
  <a href="https://github.com/solvergent/ImageSL" target="_blank" rel="noopener">Source</a>
</footer>

<script>
  // Release assets are published by .github/workflows/build-desktop.yml.
  // These names must match its outputs exactly, or the links 404.
  var REPO  = "solvergent/ImageSL";
  var ASSET = { win: "ImageSL-Setup-Windows.exe", mac: "ImageSL-macOS.dmg" };
  var LABEL = { win: "Download for Windows",      mac: "Download for macOS"  };

  // /releases/latest/download/<name> redirects straight to the newest release's
  // asset of that exact name, so the file downloads without a detour.
  function href(os){
    return "https://github.com/" + REPO + "/releases/latest/download/" + ASSET[os];
  }
  function setBtn(id, os){
    var el = document.getElementById(id);
    el.href = href(os);
    el.setAttribute('data-os', os);
    document.getElementById(id + '-label').textContent = LABEL[os];
  }

  // Put the visitor's own platform first.
  var isMac = /Mac|iPhone|iPad/.test(navigator.platform || "") ||
              /Mac OS X/.test(navigator.userAgent);
  setBtn('dl-primary',   isMac ? 'mac' : 'win');
  setBtn('dl-secondary', isMac ? 'win' : 'mac');

  // Best-effort version label. Fails silently offline or before the first release.
  fetch("https://api.github.com/repos/" + REPO + "/releases/latest")
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ if (j && j.tag_name) document.getElementById('ver').textContent = j.tag_name; })
    .catch(function(){});
</script>
</body>
</html>
