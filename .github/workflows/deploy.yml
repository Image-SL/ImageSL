name: Deploy to AWS Lightsail

# Every push to main builds the Docker image, pushes it to Amazon ECR,
# and rolls out a new deployment on the Lightsail container service.
#
# Capacity is set by the service's POWER and SCALE, which this deployment does
# not carry — they belong to the service, not to a deployment, and are changed
# with `aws lightsail update-container-service`. They matter more than anything
# in this file: a slide takes about a second of numpy on a full core, so on a
# 0.25-vCPU `nano`/`micro` it takes ten to twenty, and a 200-slide batch cannot
# finish inside any sane timeout. See docs/CAPACITY.md for the sizing and the
# exact command.
#
# Keep SCALE at 1. Analyses are held in the container's own filesystem, so with
# two nodes a slide analysed on one is invisible to the other and every second
# export would come back half empty.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write   # required for AWS OIDC (no stored keys)
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 581586866061.dkr.ecr.us-east-2.amazonaws.com
  ECR_REPO: imagesl
  SERVICE: imagesl

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::581586866061:role/imagesl-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push image
        run: |
          set -euo pipefail
          TAG="git-${GITHUB_SHA::12}"
          docker build -t "$ECR_REGISTRY/$ECR_REPO:$TAG" -t "$ECR_REGISTRY/$ECR_REPO:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPO:$TAG"
          docker push "$ECR_REGISTRY/$ECR_REPO:latest"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Deploy to Lightsail
        env:
          # Where build-desktop.yml publishes the installers. Set as repository
          # variables (Settings -> Secrets and variables -> Actions -> Variables).
          # BASE_URL wins if set, so a CDN can be put in front of the bucket
          # later without touching this file.
          DL_BUCKET: ${{ vars.IMAGESL_DOWNLOAD_BUCKET }}
          DL_BASE_URL: ${{ vars.IMAGESL_DOWNLOAD_BASE_URL }}
          # Optional override, so a future domain move needs no code change.
          # Unset is the normal case and falls back to the default below.
          IMAGESL_SITE_URL_VAR: ${{ vars.IMAGESL_SITE_URL }}
        run: |
          set -euo pipefail

          # The version comes from version.txt, never from a literal here. This
          # value is what /api/downloads reports, and desktop/updater.py compares
          # it against the version of the installed app to decide whether to
          # offer an update. A number pinned in this file does not move when a
          # release is tagged, so the comparison silently answers "you are up to
          # date" forever. See the release procedure in desktop/BUILD.md.
          VERSION="$(tr -d ' \t\r\n' < version.txt)"
          if [ -z "$VERSION" ]; then
            echo "::error::version.txt is empty - refusing to deploy a versionless build."
            exit 1
          fi
          echo "Deploying version $VERSION"

          # The bucket the installers actually live in, as a default.
          #
          # This used to be repository-variable-only, and unset meant "no
          # installer hosted yet" -> buttons greyed, "coming soon". That was
          # right when nothing was hosted. It is wrong now that something is:
          # the bucket below exists and holds the Windows installer, so an unset
          # variable stopped meaning "nothing to offer" and started meaning
          # "forgot to tell the workflow where it is" - and the failure looked
          # identical, a greyed button reading "coming soon" on a release that
          # had shipped. It cost a working download twice.
          #
          # The repository variables still win, so a CDN or a moved bucket needs
          # no change here. Hardcoding the fallback is consistent with this file
          # already hardcoding the account's ECR registry and role ARN: the
          # deployment target is not a secret and not a per-environment knob.
          DL_BUCKET_DEFAULT="imagesl-downloads-581586866061"

          # The site's canonical address. Every canonical tag, og:url, the
          # sitemap and robots.txt are built from it, so it has to be the domain
          # visitors are actually meant to be on - not merely one that resolves.
          #
          # Set here rather than in the Lightsail console: this file is the
          # source of truth and the next push overwrites anything set by hand,
          # which for this variable would silently point every canonical tag
          # back at the old domain and hand it the search ranking.
          SITE_URL="${IMAGESL_SITE_URL_VAR:-https://imagesl.com}"
          echo "Canonical site URL: $SITE_URL"

          BASE=""
          if [ -n "${DL_BASE_URL:-}" ]; then
            BASE="${DL_BASE_URL%/}"
          else
            BUCKET="${DL_BUCKET:-$DL_BUCKET_DEFAULT}"
            BASE="https://${BUCKET}.s3.${AWS_REGION}.amazonaws.com"
            if [ -z "${DL_BUCKET:-}" ]; then
              echo "IMAGESL_DOWNLOAD_BUCKET is not set; using the default bucket ${BUCKET}."
            fi
          fi
          if [ -n "$BASE" ]; then
            DL_WIN="${BASE}/latest/ImageSL-Setup-Windows.exe"
            DL_MAC="${BASE}/latest/ImageSL-macOS.dmg"
            # Written by build-desktop.yml's publish job next to the installers,
            # so /api/downloads can report the version of the bytes a user would
            # actually get rather than the version of this server.
            DL_VER="${BASE}/latest/VERSION"
            echo "Installer base: $BASE"
          else
            DL_WIN=""
            DL_MAC=""
            DL_VER=""
            echo "::warning::No IMAGESL_DOWNLOAD_BUCKET / _BASE_URL set - the desktop download buttons will stay greyed out."
          fi

          # Emit only the installer variables that actually HAVE a value.
          #
          # Defensive, not a fix for anything observed. An unset repository
          # variable arrives here as an empty string, and the deployment then
          # carries "IMAGESL_DOWNLOAD_URL_WINDOWS": "". Whether Lightsail accepts
          # that is untested: no deployment carrying one has ever reached the API
          # (the last created deployment is version 33, from 2069556 on Aug 4,
          # and the runs after it failed before authenticating to AWS at all).
          #
          # It is kept because omitting the key is the more accurate statement
          # either way. server/app.py reads these with `os.environ.get(key) or ""`
          # and treats absent and empty identically, so a blank preserves no
          # behaviour - it only asserts "this is configured, to nothing".
          DL_ENV=""
          for pair in "IMAGESL_DOWNLOAD_URL_WINDOWS=${DL_WIN}" \
                      "IMAGESL_DOWNLOAD_URL_MACOS=${DL_MAC}" \
                      "IMAGESL_DOWNLOAD_VERSION_URL=${DL_VER}"; do
            key="${pair%%=*}"
            val="${pair#*=}"
            if [ -n "$val" ]; then
              DL_ENV="${DL_ENV},
                  \"${key}\": \"${val}\""
            fi
          done

          cat > deploy.json <<EOF
          {
            "serviceName": "${SERVICE}",
            "containers": {
              "imagesl": {
                "image": "${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG}",
                "environment": {
                  "IMAGESL_VERSION": "${VERSION}",
                  "IMAGESL_SITE_URL": "${SITE_URL}",
                  "IMAGESL_MAX_CONCURRENCY": "2",
                  "IMAGESL_CACHE_MAX": "400",
                  "IMAGESL_CACHE_MB": "6144",
                  "IMAGESL_CACHE_TTL": "28800"${DL_ENV}
                },
                "ports": { "8000": "HTTP" }
              }
            },
            "publicEndpoint": {
              "containerName": "imagesl",
              "containerPort": 8000,
              "healthCheck": {
                "path": "/api/health",
                "successCodes": "200-299",
                "intervalSeconds": 10,
                "timeoutSeconds": 5,
                "healthyThreshold": 2,
                "unhealthyThreshold": 5
              }
            }
          }
          EOF
          echo "--- deployment payload ---"
          cat deploy.json
          echo "--------------------------"

          # Retry while a previous deployment is still rolling out — and ONLY
          # then.
          #
          # This loop used to treat every failure as "service busy". A permanent
          # error therefore took twelve attempts and fifteen minutes to surface,
          # and surfaced as "Could not submit deployment after retries", which
          # names the loop rather than the cause: the AWS message scrolled past
          # eleven times and the last line of the log was the one sentence that
          # said nothing. A rejection that will be identical on the twelfth try
          # should be reported on the first.
          for i in $(seq 1 12); do
            if err="$(aws lightsail create-container-service-deployment \
                        --region "$AWS_REGION" --cli-input-json file://deploy.json 2>&1)"; then
              echo "$err"
              echo "Deployment submitted."
              exit 0
            fi
            echo "$err" >&2
            case "$err" in
              *InvalidInputException*|*ValidationException*|*ValidationError*|\
              *AccessDenied*|*UnauthorizedOperation*|*NotFoundException*|\
              *does\ not\ exist*|*could\ not\ be\ found*)
                echo "::error::Lightsail rejected this deployment outright - the same request will be refused every time, so it is not being retried. The AWS message is immediately above."
                exit 1
                ;;
            esac
            echo "Service busy (attempt $i) - retrying in 20s..."
            sleep 20
          done
          echo "::error::Service was still busy after 12 attempts over ~4 minutes. Last AWS message is above."
          exit 1
