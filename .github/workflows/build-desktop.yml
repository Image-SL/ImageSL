name: Build desktop apps

# Builds the offline ImageSL desktop app for Windows and macOS.
#   * push a tag like v2.0.1  -> builds, smoke-tests, publishes to S3, and cuts
#                                a GitHub Release
#   * manual run (workflow_dispatch) -> builds, smoke-tests, publishes to S3
#
# The asset names must stay exactly in step with server/app.py's _DOWNLOADS map:
#   ImageSL-Setup-Windows.exe   (Inno Setup installer)
#   ImageSL-macOS.dmg           (drag-to-Applications disk image)
#
# The site does NOT link to GitHub Releases. This repository is private, so
# release URLs 404 for every anonymous visitor - and they 404 as an HTML page,
# which navigates the visitor away instead of downloading. The landing page hits
# /download/<platform> on the app itself, which redirects to the S3 objects the
# `publish` job below uploads. The GitHub Release is kept only as an archive for
# people who can see the repo; nothing user-facing depends on it.
#
# Code signing is intentionally NOT wired in yet: it needs real certificates
# (a Windows Authenticode cert; an Apple Developer ID + notarization). See
# desktop/BUILD.md — add them as repo secrets and uncomment the signing steps.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: ImageSL-Setup-Windows
            ext: exe
          - os: macos-latest
            asset: ImageSL-macOS
            ext: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        shell: bash
        run: |
          # Only a tag carries a real version. On workflow_dispatch GITHUB_REF_NAME
          # is the branch name, which must not end up in version.txt.
          # Written as explicit ifs, not `[ x ] && y`: these steps run under
          # `set -e`, where a trailing false test would abort the step.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="0.0.0-dev"
          fi
          if [ -z "$VER" ]; then VER="0.0.0-dev"; fi

          # A tag must agree with the committed version.txt, because the two feed
          # different consumers that are then compared to each other: this build
          # stamps the installer from the tag, while deploy.yml stamps the server
          # (and so /api/downloads) from version.txt. If they drift, the update
          # check in desktop/updater.py compares an installer version against a
          # server version that means something else - and either never offers a
          # published update, or offers one that was never built. Fail loudly at
          # the tag rather than shipping a silently broken update path.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            FILE_VER="$(tr -d ' \t\r\n' < version.txt || true)"
            if [ "$FILE_VER" != "$VER" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} declares version '${VER}' but version.txt says '${FILE_VER}'."
              echo "::error::Bump version.txt, commit it, and re-tag that commit. See desktop/BUILD.md."
              exit 1
            fi
          fi
          # Windows VERSIONINFO and CFBundleShortVersionString both reject
          # anything but a numeric x[.y[.z]], so derive one alongside.
          NUM=$(printf '%s' "$VER" | grep -oE '^[0-9]+(\.[0-9]+){0,2}' || true)
          if [ -z "$NUM" ]; then NUM="0.0.0"; fi
          echo "$VER" > version.txt
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "VERSION_NUM=$NUM" >> "$GITHUB_ENV"
          echo "Building version $VER (numeric $NUM)"

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt

      # macOS wants .icns; the repo only carries .ico and .png. Generate it from
      # the 1024px master. Never fatal — a missing icns just means a default icon.
      - name: Generate macOS icon
        if: runner.os == 'macOS'
        shell: bash
        continue-on-error: true
        run: |
          # server/web/assets/logo.png is the canonical mark - every raster
          # asset is rendered from logo.svg into it. This used to read
          # client/logo-source.png, which still held the retired "SL" shield, so
          # the Mac app would have shipped an icon nobody recognises while the
          # Windows one was correct.
          SRC=server/web/assets/logo.png
          if [ ! -f "$SRC" ]; then SRC=client/logo-source.png; fi
          if [ ! -f "$SRC" ]; then echo "no icon source found; skipping"; exit 0; fi
          rm -rf ImageSL.iconset && mkdir ImageSL.iconset
          for sz in 16 32 128 256 512; do
            sips -z $sz $sz         "$SRC" --out "ImageSL.iconset/icon_${sz}x${sz}.png"    >/dev/null
            sips -z $((sz*2)) $((sz*2)) "$SRC" --out "ImageSL.iconset/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns ImageSL.iconset -o desktop/ImageSL.icns
          ls -l desktop/ImageSL.icns

      - name: Build
        shell: bash
        run: pyinstaller --noconfirm --distpath dist --workpath build desktop/ImageSL.spec

      - name: Smoke-test the frozen app (Windows, headless)
        if: runner.os == 'Windows'
        shell: bash
        run: ./dist/ImageSL/ImageSL.exe --selftest

      # A manifest of the build, so an installed app can update itself by
      # replacing only the files that changed - ~600 KB of engine and web assets
      # out of a 257 MB tree - instead of re-downloading and re-running the
      # whole installer. The installer stays the fallback, and is the only path
      # for any release that touches the runtime or the executable.
      #
      # Windows only for now: DELTA_ROOTS in server/delta_update.py describes
      # the onedir layout (`_internal/server/...`), and a macOS .app nests the
      # same files under Contents/, so macOS needs its own roots before it can
      # be offered. Publishing no manifest is a supported state - /api/downloads
      # then reports manifest_sha256:null and the updater uses the installer,
      # which is exactly today's behaviour.
      - name: Build the update manifest (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python desktop/make_manifest.py dist/ImageSL \
            --out update/windows --version "$VERSION" --platform windows
          ls -l update/windows

      - name: Verify the manifest describes the build it was made from
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # A manifest that disagrees with the tree it shipped beside would hand
          # every client a checksum it can never satisfy, so the update would
          # fail for everyone with no sign of trouble here. Re-check it against
          # the built tree before it is allowed off the runner.
          python - <<'PY'
          import hashlib, json, pathlib, sys
          tree = pathlib.Path("dist/ImageSL")
          m = json.loads(pathlib.Path("update/windows/manifest.json").read_text())
          bad = []
          for f in m["files"]:
              p = tree / f["path"]
              if not p.is_file():
                  bad.append(f"missing: {f['path']}"); continue
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              if h != f["sha256"]:
                  bad.append(f"digest differs: {f['path']}")
          store = pathlib.Path("update/windows/files")
          for f in m["files"]:
              if f["delta"] and not (store / f["sha256"]).is_file():
                  bad.append(f"blob missing for patchable file: {f['path']}")
          if bad:
              print("\n".join(f"::error::{b}" for b in bad[:40]))
              sys.exit(1)
          patch = [f for f in m["files"] if f["delta"]]
          print(f"manifest OK: {len(m['files'])} files, {len(patch)} patchable, "
                f"{sum(f['bytes'] for f in patch)/1024:.0f} KB, version {m['version']}")
          PY

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ImageSL-Update-Windows
          path: update/windows
          if-no-files-found: error

      # ---- package -------------------------------------------------------- #
      - name: Package (Windows -> Inno Setup installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Installers land in different places depending on who put them there:
          # the runner image and chocolatey use Program Files (x86), winget
          # installs per-user. Check every candidate rather than one path.
          function Find-ISCC {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
            )
            foreach ($c in $candidates) { if (Test-Path $c) { return $c } }
            $onPath = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($onPath) { return $onPath.Source }
            return $null
          }
          $iscc = Find-ISCC
          if (-not $iscc) {
            Write-Host "Inno Setup not preinstalled; installing via chocolatey."
            choco install innosetup -y --no-progress
            $iscc = Find-ISCC
          }
          if (-not $iscc) { throw "ISCC.exe not found in any known location" }
          Write-Host "Using $iscc"
          & $iscc "/DMyAppVersion=$env:VERSION" "/DMyAppVersionNum=$env:VERSION_NUM" "desktop\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }
          if (-not (Test-Path "${{ matrix.asset }}.exe")) { throw "installer not produced" }
          Get-Item "${{ matrix.asset }}.exe" | Select-Object Name,Length

      - name: Ad-hoc sign the .app (macOS)
        if: runner.os == 'macOS'
        run: |
          # Not a Developer ID signature — it does NOT clear Gatekeeper's
          # "unidentified developer" prompt. It does prevent Apple Silicon from
          # refusing an unsigned bundle outright ("app is damaged"), which is the
          # difference between a first run that needs a right-click -> Open and
          # one that is impossible. Replace with a real identity once certs exist.
          codesign --force --deep --sign - dist/ImageSL.app
          codesign --verify --verbose dist/ImageSL.app

      # Runs AFTER signing and tests the .app, not dist/ImageSL/. Both exist on
      # macOS - COLLECT writes the plain directory and BUNDLE wraps it - so an
      # `-x dist/ImageSL/ImageSL` test silently exercises the tree that is NOT
      # shipped, leaving the bundle in the dmg completely unverified. Testing
      # something adjacent to what ships is how a crash that killed every real
      # launch passed every smoke test before; see the note in launcher.py.
      - name: Smoke-test the signed .app (macOS, headless)
        if: runner.os == 'macOS'
        run: ./dist/ImageSL.app/Contents/MacOS/ImageSL --selftest

      - name: Package (macOS -> dmg)
        if: runner.os == 'macOS'
        run: |
          test -d "dist/ImageSL.app" || { echo "ImageSL.app was not built"; exit 1; }
          rm -rf dmgroot && mkdir dmgroot
          # ditto, not cp -R: it is the tool that reliably preserves the code
          # signature and extended attributes of a bundle. A copy that quietly
          # strips them produces a dmg whose app will not launch.
          ditto "dist/ImageSL.app" "dmgroot/ImageSL.app"
          # The drag-to-install target users expect inside the disk image.
          ln -s /Applications "dmgroot/Applications"
          hdiutil create -volname "ImageSL" -srcfolder dmgroot -ov -format UDZO "${{ matrix.asset }}.dmg"
          ls -lh "${{ matrix.asset }}.dmg"

      # The dmg is the artifact a user actually double-clicks, and nothing so far
      # has opened it. Mount it and check the bundle survived the round trip.
      - name: Verify the dmg mounts and carries a valid app
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          MNT=$(mktemp -d)
          hdiutil attach "${{ matrix.asset }}.dmg" -mountpoint "$MNT" -nobrowse -readonly
          trap 'hdiutil detach "$MNT" -quiet || true' EXIT
          test -d "$MNT/ImageSL.app" || { echo "dmg has no ImageSL.app"; exit 1; }
          test -L "$MNT/Applications" || { echo "dmg has no /Applications drop target"; exit 1; }
          codesign --verify --verbose "$MNT/ImageSL.app"
          echo "dmg contents verified."

      # ---- SIGNING (disabled until certs exist) --------------------------- #
      # Windows Authenticode — sign dist\ImageSL\ImageSL.exe BEFORE running ISCC,
      # then sign the produced installer too:
      #   - uses: dlemstra/code-sign-action@v1
      #     with: { certificate: '${{ secrets.WINDOWS_PFX_BASE64 }}', password: '${{ secrets.WINDOWS_PFX_PASSWORD }}', files: dist/ImageSL/ImageSL.exe }
      # macOS Developer ID + notarization — replace the ad-hoc step above:
      #   codesign --deep --force --options runtime --sign "$APPLE_DEVID" dist/ImageSL.app
      #   xcrun notarytool submit "${{ matrix.asset }}.dmg" --apple-id ... --team-id ... --password ... --wait
      #   xcrun stapler staple "${{ matrix.asset }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.${{ matrix.ext }}
          if-no-files-found: error

  # Puts the installers where the live site can actually reach them. This is the
  # step that makes the download buttons work; without it the routes exist, the
  # env vars point nowhere, and every button reads "coming soon".
  #
  # A single ubuntu job rather than an upload per matrix leg: one place to hold
  # AWS credentials, and the two runners cannot race on the same keys.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # OIDC federation into AWS; no stored keys
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Check the bucket is configured
        id: cfg
        env:
          BUCKET: ${{ vars.IMAGESL_DOWNLOAD_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${BUCKET:-}" ]; then
            echo "::warning::Repository variable IMAGESL_DOWNLOAD_BUCKET is not set - skipping publish."
            echo "::warning::The build artifacts are still attached to this run, but the live site will not see them."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.cfg.outputs.go == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::392617884477:role/imagesl-github-deploy
          aws-region: us-east-2

      - name: Upload installers to S3
        if: steps.cfg.outputs.go == 'true'
        env:
          BUCKET: ${{ vars.IMAGESL_DOWNLOAD_BUCKET }}
        run: |
          set -euo pipefail

          # Version for the immutable copy. A tag is the only real version; a
          # manual run archives under the commit so it cannot overwrite a release.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
            IS_RELEASE=1
          else
            VER="dev-${GITHUB_SHA::12}"
            IS_RELEASE=0
          fi
          echo "Publishing as $VER"

          # Only a TAG may move the keys users actually receive.
          #
          # `latest/` is what /download/<platform> redirects to and what
          # latest/VERSION advertises to every installed app. This job runs on
          # workflow_dispatch too, so without this guard a manual run from any
          # branch would overwrite the live installer with a dev build and set
          # the published version to "dev-<sha>" - which is not a version any
          # updater can compare sensibly, and leaves the site handing out an
          # untagged build. A dev run still uploads its immutable v/<VER>/ copy,
          # so it can be fetched and tested deliberately; it just cannot become
          # what everyone else downloads by accident.
          if [ "$IS_RELEASE" = "1" ]; then
            echo "Tag build: v/${VER}/ and latest/ will both be updated."
          else
            echo "::notice::Not a tag - publishing only to v/${VER}/. latest/ is left untouched."
          fi

          upload() {
            local src="$1" name="$2" ctype="$3"
            if [ ! -f "$src" ]; then
              echo "::warning::$name was not built by this run - skipping."
              return 0
            fi
            local sum
            sum="$(sha256sum "$src" | cut -d' ' -f1)"
            echo "--- $name ($(stat -c%s "$src") bytes) sha256=$sum"

            # Immutable, versioned copy first: if anything below fails, the
            # provenance copy still exists and nothing user-facing has moved yet.
            aws s3 cp "$src" "s3://${BUCKET}/v/${VER}/${name}" \
              --content-type "$ctype" \
              --content-disposition "attachment; filename=\"${name}\"" \
              --cache-control "public, max-age=31536000, immutable"

            # Then the stable key the app redirects to. Short max-age on purpose:
            # this key is overwritten by every release, so a long one would leave
            # browsers and intermediaries handing out a previous 86MB installer
            # after a new one shipped. 5 minutes costs nothing and bounds the lie.
            if [ "$IS_RELEASE" = "1" ]; then
            aws s3 cp "$src" "s3://${BUCKET}/latest/${name}" \
              --content-type "$ctype" \
              --content-disposition "attachment; filename=\"${name}\"" \
              --cache-control "public, max-age=300"
            fi

            # The digest, published AFTER the bytes it describes.
            #
            # /api/downloads republishes this and the desktop updater refuses to
            # run a download that does not match it. Publishing the installer
            # without the sidecar does not fail loudly - it returns sha256:null,
            # leaves the updater with nothing to check, and in-app updates stop
            # working while the bucket looks perfectly healthy. Order matters for
            # the same reason: a digest visible before its bytes would describe
            # a file nobody can fetch yet.
            printf '%s  %s\n' "$sum" "$name" > "${src}.sha256"
            aws s3 cp "${src}.sha256" "s3://${BUCKET}/v/${VER}/${name}.sha256" \
              --content-type "text/plain; charset=utf-8" \
              --cache-control "public, max-age=31536000, immutable"
            if [ "$IS_RELEASE" = "1" ]; then
            aws s3 cp "${src}.sha256" "s3://${BUCKET}/latest/${name}.sha256" \
              --content-type "text/plain; charset=utf-8" \
              --cache-control "public, max-age=300"
            fi
          }

          # Content-Disposition is set on the OBJECT because /download/<platform>
          # answers with a 302 - we hand off the response and never get to set a
          # header on the bytes. Without it a browser may render rather than save.
          upload "artifacts/ImageSL-Setup-Windows/ImageSL-Setup-Windows.exe" \
                 "ImageSL-Setup-Windows.exe" "application/octet-stream"
          upload "artifacts/ImageSL-macOS/ImageSL-macOS.dmg" \
                 "ImageSL-macOS.dmg" "application/x-apple-diskimage"

          # The partial-update store. Order matters exactly as it does for the
          # installer digests: the blobs go up FIRST, because the manifest names
          # them and a manifest that is visible before its objects describes
          # files nobody can fetch yet. The blobs are content-addressed, so they
          # are immutable and can be cached forever; re-uploading a build only
          # adds objects for files that genuinely changed.
          UPD="artifacts/ImageSL-Update-Windows"
          if [ -d "$UPD/files" ]; then
            if [ "$IS_RELEASE" = "1" ]; then
            aws s3 sync "$UPD/files" "s3://${BUCKET}/latest/update/windows/files" \
              --content-type "application/octet-stream" \
              --cache-control "public, max-age=31536000, immutable"
            aws s3 cp "$UPD/manifest.json" \
              "s3://${BUCKET}/latest/update/windows/manifest.json" \
              --content-type "application/json" \
              --cache-control "public, max-age=60"
            # The digest last, after the bytes it describes - /api/downloads
            # republishes it and the client refuses any manifest that does not
            # match, so a stale digest disables partial updates rather than
            # weakening them.
            aws s3 cp "$UPD/manifest.json.sha256" \
              "s3://${BUCKET}/latest/update/windows/manifest.json.sha256" \
              --content-type "text/plain; charset=utf-8" \
              --cache-control "public, max-age=60"
            fi
            # An immutable copy under the version, so a release can be inspected
            # (or rolled back to) after `latest` has moved on.
            aws s3 sync "$UPD" "s3://${BUCKET}/v/${VER}/update/windows" \
              --cache-control "public, max-age=31536000, immutable"
            echo "Published partial-update store for $VER"
          else
            echo "::warning::No Windows update manifest in this run - partial updates will be unavailable and clients will use the full installer."
          fi

          # What version those bytes ARE, published next to them.
          #
          # /api/downloads has to answer "what can this user install", and until
          # this marker existed it answered with the SERVER's version instead -
          # a different number, deployed by a different workflow. The two agree
          # right up until a release where the server rolls out and this build
          # does not, and then every installed app is offered an update that was
          # never published. Only a value written by the job that uploaded the
          # installers can speak for the installers.
          #
          # Written last: if any upload above failed, the marker still names the
          # previous release, which is the truthful answer.
          if [ "$IS_RELEASE" = "1" ]; then
            printf '%s' "$VER" > VERSION
            aws s3 cp VERSION "s3://${BUCKET}/latest/VERSION" \
              --content-type "text/plain; charset=utf-8" \
              --cache-control "public, max-age=60"
            echo "Published version marker: $VER"
          else
            echo "Dev run: latest/VERSION left as-is."
          fi

      - name: Confirm the live site can see them
        if: steps.cfg.outputs.go == 'true'
        run: |
          set -euo pipefail
          # The app probes the object before advertising it, so this is the same
          # question a visitor's browser asks. Reported, not failed on: the site
          # may legitimately not be redeployed with the URLs set yet.
          echo "https://imagesl.com/api/downloads says:"
          curl -fsS https://imagesl.com/api/downloads || echo "(site unreachable)"

  # A single release job, rather than each matrix leg publishing, so the two
  # runners cannot race to create the same release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List what will be published
        run: ls -lhR artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
